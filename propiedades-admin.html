<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Gestionar Publicaciones | CostoSV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: var(--bg-main); }
        .admin-header { background-color: var(--primary); color: white; padding: 25px 0; }
        .admin-header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0; }
        .admin-header p { color: var(--gold-light); margin: 5px 0 0; }
        .admin-wrap { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .gestion-table { width: 100%; border-collapse: collapse; background: var(--bg-alt); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
        .gestion-table th { background: var(--primary); color: white; text-align: left; padding: 12px 16px; font-size: 0.78rem; text-transform: uppercase; }
        .gestion-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
        .gestion-table tr:last-child td { border-bottom: none; }
        .gestion-thumb { width: 70px; height: 52px; object-fit: cover; border-radius: 6px; background: var(--bg-main); }
        .gestion-titulo { font-weight: 600; color: var(--primary); max-width: 260px; }
        .estado-chip { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; cursor: pointer; border: none; }
        .estado-chip.publicada { background: #e7f7ec; color: #1b5e20; }
        .estado-chip.oculta { background: #f3f4f6; color: #6b7280; }
        .btn-eliminar { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: var(--radius-sm); padding: 6px 12px; font-size: 0.8rem; cursor: pointer; }
        .btn-eliminar:hover { background: #fee2e2; }
        .tab-switch { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-btn {
            flex: 1; text-align: center; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);
            background: var(--bg-alt); color: var(--text-main); font-weight: 700; cursor: pointer;
            font-family: 'Outfit', sans-serif; font-size: 0.9rem;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .btn-editar { background: #eef2ff; color: var(--primary); border: 1px solid #c7d2fe; border-radius: var(--radius-sm); padding: 6px 12px; font-size: 0.8rem; cursor: pointer; margin-right: 6px; }
        .btn-editar:hover { background: #e0e7ff; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(10,15,28,0.6); z-index: 2000;
            align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal-box { background: white; border-radius: var(--radius-md); max-width: 720px; width: 100%; padding: 28px; box-shadow: var(--shadow-md); }
        .modal-box h3 { font-family: 'Playfair Display', serif; color: var(--primary); margin: 0 0 18px; }
        .modal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .modal-form-grid .full { grid-column: 1 / -1; }
        .modal-form-grid label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-light); margin-bottom: 5px; }
        .modal-form-grid input, .modal-form-grid select, .modal-form-grid textarea {
            width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-family: 'Outfit', sans-serif; font-size: 0.9rem; color: var(--text-main);
        }
        .modal-form-grid textarea { resize: vertical; min-height: 60px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .btn-modal-cancel { background: none; border: 1px solid var(--border); color: var(--text-main); border-radius: var(--radius-sm); padding: 10px 20px; cursor: pointer; }
        .btn-modal-guardar { background: var(--gold); color: var(--primary); border: none; border-radius: var(--radius-sm); padding: 10px 20px; font-weight: 700; cursor: pointer; }
        .fotos-edit-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .fotos-edit-thumb { width: 90px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: white; }
        .fotos-edit-thumb img { width: 100%; height: 65px; object-fit: cover; display: block; }
        .fotos-edit-thumb button { width: 100%; border: none; background: #fef2f2; color: #b91c1c; font-size: 0.65rem; padding: 3px; cursor: pointer; }
        .fotos-edit-count { font-size: 0.75rem; color: var(--text-light); margin-top: 4px; }
        .modal-form-grid textarea[id$="-fotos"] { min-height: 50px; }
        .modal-checks { display: flex; gap: 16px; flex-wrap: wrap; }
        .modal-checks label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; color: var(--text-main); margin: 0; }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <h1>🗂️ Gestionar Publicaciones</h1>
            <p>Ver, publicar/ocultar y eliminar lo ya subido</p>
        </div>
    </header>

    <div class="admin-wrap">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <a href="panel.html" style="font-size:0.85rem; color: var(--text-light);"><i class="fas fa-arrow-left"></i> Volver al panel</a>
            <button onclick="CostoSVAuth.signOut()" style="background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;font-size:0.8rem;cursor:pointer;">Cerrar sesión</button>
        </div>

        <div class="tab-switch">
            <button class="tab-btn active" id="btn-tab-prop" onclick="cambiarTabGestion('prop')">🏠 Propiedades</button>
            <button class="tab-btn" id="btn-tab-fr" onclick="cambiarTabGestion('fr')">🏪 Franquicias</button>
        </div>

        <div class="tab-panel active" id="tab-prop">
            <div class="scroll-x" style="overflow-x:auto;">
                <table class="gestion-table">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Título</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-light);">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="tab-panel" id="tab-fr">
            <div class="scroll-x" style="overflow-x:auto;">
                <table class="gestion-table">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Inversión</th>
                            <th>Rubro</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body-fr">
                        <tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-light);">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== MODAL: Editar franquicia ===== -->
    <div class="modal-overlay" id="modal-editar-fr">
        <div class="modal-box">
            <h3>Editar franquicia</h3>
            <div class="modal-form-grid">
                <div><label>Nombre</label><input type="text" id="ed-nombre"></div>
                <div><label>Aliado / representante</label><input type="text" id="ed-aliado"></div>
                <div>
                    <label>Rubro</label>
                    <select id="ed-categoria">
                        <option>Alimentos y Bebidas</option>
                        <option>Retail y Moda</option>
                        <option>Servicios</option>
                        <option>Salud y Belleza</option>
                        <option>Educación</option>
                        <option>Entretenimiento</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div><label>Inversión total</label><input type="text" id="ed-inversion"></div>
                <div><label>Cuota de franquicia</label><input type="text" id="ed-cuota"></div>
                <div><label>Regalías</label><input type="text" id="ed-regalias"></div>
                <div><label>Retorno de inversión estimado</label><input type="text" id="ed-retorno"></div>
                <div><label>Espacio requerido</label><input type="text" id="ed-espacio"></div>
                <div><label>Empleados requeridos</label><input type="text" id="ed-empleados"></div>
                <div><label>Unidades actuales</label><input type="text" id="ed-unidades"></div>
                <div><label>Años en el mercado</label><input type="text" id="ed-anos"></div>
                <div class="full"><label>Territorios disponibles</label><input type="text" id="ed-territorios"></div>
                <div class="full"><label>Link de referencia</label><input type="url" id="ed-link"></div>
                <div class="full"><label>Beneficios / soporte (uno por línea)</label><textarea id="ed-beneficios"></textarea></div>
                <div class="full"><label>Descripción</label><textarea id="ed-desc"></textarea></div>
                <div class="full">
                    <label>Fotos (subí archivos de tu PC, o pegá URLs una por línea o separadas por coma)</label>
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                        <input type="file" accept="image/*" multiple onchange="CostoSVAuth.subirFotosA(this, 'ed-fotos', () => previsualizarFotos('ed-fotos', 'ed-fotos-preview'))">
                        <span style="display:none; font-size:0.8rem; color:var(--text-light);"></span>
                    </div>
                    <textarea id="ed-fotos" oninput="previsualizarFotos('ed-fotos', 'ed-fotos-preview')"></textarea>
                    <div class="fotos-edit-preview" id="ed-fotos-preview"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-cancel" onclick="cerrarEdicionFr()">Cancelar</button>
                <button class="btn-modal-guardar" onclick="guardarEdicionFr()">Guardar cambios</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL: Editar propiedad ===== -->
    <div class="modal-overlay" id="modal-editar-prop">
        <div class="modal-box" style="max-width: 860px;">
            <h3>Editar propiedad</h3>
            <div class="modal-form-grid">
                <div class="full"><label>Link RE/MAX (referencia)</label><input type="url" id="edp-link"></div>
                <div><label>Título</label><input type="text" id="edp-titulo"></div>
                <div><label>Precio</label><input type="text" id="edp-precio"></div>
                <div><label>Ubicación</label><input type="text" id="edp-ubicacion"></div>
                <div>
                    <label>Categoría</label>
                    <select id="edp-categoria">
                        <option>Vivienda Residencial</option>
                        <option>RE/MAX Exclusive (Lujo)</option>
                        <option>Comercial / Industrial</option>
                        <option>Proyectos y Desarrollos</option>
                    </select>
                </div>
                <div>
                    <label>Tipo de contrato</label>
                    <select id="edp-tipo-contrato">
                        <option value="venta">Venta</option>
                        <option value="alquiler">Alquiler</option>
                    </select>
                </div>
                <div><label>Tipo de propiedad</label><input type="text" id="edp-tipo-propiedad"></div>
                <div><label>ID externo</label><input type="text" id="edp-id-externo"></div>
                <div><label>Habitaciones</label><input type="text" id="edp-hab"></div>
                <div><label>Baños</label><input type="text" id="edp-banos"></div>
                <div><label>m² (general)</label><input type="text" id="edp-m2"></div>
                <div><label>Tamaño de lote</label><input type="text" id="edp-tamano-lote"></div>
                <div><label>Tamaño de construcción</label><input type="text" id="edp-tamano-construccion"></div>
                <div><label>Latitud</label><input type="text" id="edp-latitud"></div>
                <div><label>Longitud</label><input type="text" id="edp-longitud"></div>
                <div><label>Tour virtual (URL)</label><input type="url" id="edp-tour"></div>
                <div><label>Video (URL)</label><input type="url" id="edp-video"></div>
                <div class="full modal-checks">
                    <label><input type="checkbox" id="edp-garage" style="width:auto;"> Garage</label>
                    <label><input type="checkbox" id="edp-hoa" style="width:auto;"> Cuota de mantenimiento (HOA)</label>
                    <label><input type="checkbox" id="edp-comunidad-cerrada" style="width:auto;"> Comunidad cerrada</label>
                    <label><input type="checkbox" id="edp-nueva" style="width:auto;"> Propiedad nueva</label>
                </div>
                <div class="full"><label>Descripción original</label><textarea id="edp-desc"></textarea></div>
                <div class="full"><label>Copy de venta (texto publicado)</label><textarea id="edp-copy"></textarea></div>
                <div class="full">
                    <label>Fotos (subí archivos de tu PC, o pegá URLs una por línea o separadas por coma)</label>
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                        <input type="file" accept="image/*" multiple onchange="CostoSVAuth.subirFotosA(this, 'edp-fotos', () => previsualizarFotos('edp-fotos', 'edp-fotos-preview'))">
                        <span style="display:none; font-size:0.8rem; color:var(--text-light);"></span>
                    </div>
                    <textarea id="edp-fotos" oninput="previsualizarFotos('edp-fotos', 'edp-fotos-preview')"></textarea>
                    <div class="fotos-edit-preview" id="edp-fotos-preview"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal-cancel" onclick="cerrarEdicionProp()">Cancelar</button>
                <button class="btn-modal-guardar" onclick="guardarEdicionProp()">Guardar cambios</button>
            </div>
        </div>
    </div>

    <script src="config.js?v=2"></script>
    <script src="login.js?v=4"></script>
    <script>
        const SUPA_URL = window.SITE_CONFIG.SUPABASE_URL;
        let propiedades = [];
        let franquicias = [];

        function cambiarTabGestion(nombre) {
            ['prop', 'fr'].forEach(t => {
                document.getElementById('tab-' + t).classList.toggle('active', t === nombre);
                document.getElementById('btn-tab-' + t).classList.toggle('active', t === nombre);
            });
        }

        async function cargarTodas() {
            const body = document.getElementById('tabla-body');
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/propiedades?select=*&order=created_at.desc`, { headers });
                if (!res.ok) throw new Error('No se pudieron cargar (' + res.status + ')');
                propiedades = await res.json();
                render();
            } catch (ex) {
                body.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#b91c1c; padding:20px;">${ex.message}</td></tr>`;
            }
        }

        function render() {
            const body = document.getElementById('tabla-body');
            if (!propiedades.length) {
                body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-light);">Todavía no hay propiedades cargadas.</td></tr>';
                return;
            }
            body.innerHTML = propiedades.map(p => {
                const foto = (p.fotos && p.fotos[0]) || '';
                const fecha = new Date(p.created_at).toLocaleDateString('es-SV', { day: '2-digit', month: 'short', year: 'numeric' });
                return `
                    <tr>
                        <td>${foto ? `<img src="${foto}" class="gestion-thumb" onerror="this.style.display='none'">` : ''}</td>
                        <td class="gestion-titulo">${p.titulo}</td>
                        <td>${p.precio}</td>
                        <td>${p.categoria}</td>
                        <td>${fecha}</td>
                        <td><button class="estado-chip ${p.publicada ? 'publicada' : 'oculta'}" onclick="cambiarEstado('${p.id}', ${!p.publicada})">${p.publicada ? '✓ Publicada' : 'Oculta'}</button></td>
                        <td>
                            <button class="btn-editar" onclick="abrirEdicionProp('${p.id}')"><i class="fas fa-pen"></i> Editar</button>
                            <button class="btn-eliminar" onclick="eliminar('${p.id}')"><i class="fas fa-trash"></i> Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function cambiarEstado(id, nuevoValor) {
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/propiedades?id=eq.${id}`, {
                    method: 'PATCH', headers: { ...headers, Prefer: 'return=minimal' },
                    body: JSON.stringify({ publicada: nuevoValor }),
                });
                if (!res.ok) throw new Error('No se pudo actualizar (' + res.status + ')');
                const p = propiedades.find(x => x.id === id);
                if (p) p.publicada = nuevoValor;
                render();
            } catch (ex) {
                alert(ex.message);
            }
        }

        async function eliminar(id) {
            const p = propiedades.find(x => x.id === id);
            if (!confirm(`¿Eliminar "${p ? p.titulo : 'esta propiedad'}"? Esto no se puede deshacer.`)) return;
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/propiedades?id=eq.${id}`, {
                    method: 'DELETE', headers: { ...headers, Prefer: 'return=minimal' },
                });
                if (!res.ok) throw new Error('No se pudo eliminar (' + res.status + ')');
                propiedades = propiedades.filter(x => x.id !== id);
                render();
            } catch (ex) {
                alert(ex.message);
            }
        }

        // ---------- Franquicias ----------
        async function cargarTodasFr() {
            const body = document.getElementById('tabla-body-fr');
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/franquicias?select=*&order=created_at.desc`, { headers });
                if (!res.ok) throw new Error('No se pudieron cargar (' + res.status + ')');
                franquicias = await res.json();
                renderFr();
            } catch (ex) {
                body.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#b91c1c; padding:20px;">${ex.message}</td></tr>`;
            }
        }

        function renderFr() {
            const body = document.getElementById('tabla-body-fr');
            if (!franquicias.length) {
                body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-light);">Todavía no hay franquicias cargadas.</td></tr>';
                return;
            }
            body.innerHTML = franquicias.map(f => {
                const foto = (f.fotos && f.fotos[0]) || '';
                const fecha = new Date(f.created_at).toLocaleDateString('es-SV', { day: '2-digit', month: 'short', year: 'numeric' });
                return `
                    <tr>
                        <td>${foto ? `<img src="${foto}" class="gestion-thumb" onerror="this.style.display='none'">` : ''}</td>
                        <td class="gestion-titulo">${f.nombre}</td>
                        <td>${f.inversion_total || '—'}</td>
                        <td>${f.categoria}</td>
                        <td>${fecha}</td>
                        <td><button class="estado-chip ${f.publicada ? 'publicada' : 'oculta'}" onclick="cambiarEstadoFr('${f.id}', ${!f.publicada})">${f.publicada ? '✓ Publicada' : 'Oculta'}</button></td>
                        <td>
                            <button class="btn-editar" onclick="abrirEdicionFr('${f.id}')"><i class="fas fa-pen"></i> Editar</button>
                            <button class="btn-eliminar" onclick="eliminarFr('${f.id}')"><i class="fas fa-trash"></i> Eliminar</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function cambiarEstadoFr(id, nuevoValor) {
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/franquicias?id=eq.${id}`, {
                    method: 'PATCH', headers: { ...headers, Prefer: 'return=minimal' },
                    body: JSON.stringify({ publicada: nuevoValor }),
                });
                if (!res.ok) throw new Error('No se pudo actualizar (' + res.status + ')');
                const f = franquicias.find(x => x.id === id);
                if (f) f.publicada = nuevoValor;
                renderFr();
            } catch (ex) {
                alert(ex.message);
            }
        }

        async function eliminarFr(id) {
            const f = franquicias.find(x => x.id === id);
            if (!confirm(`¿Eliminar "${f ? f.nombre : 'esta franquicia'}"? Esto no se puede deshacer.`)) return;
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/franquicias?id=eq.${id}`, {
                    method: 'DELETE', headers: { ...headers, Prefer: 'return=minimal' },
                });
                if (!res.ok) throw new Error('No se pudo eliminar (' + res.status + ')');
                franquicias = franquicias.filter(x => x.id !== id);
                renderFr();
            } catch (ex) {
                alert(ex.message);
            }
        }

        // ---------- Edicion (helpers compartidos) ----------
        // Acepta una URL por linea Y/O varias separadas por coma en la misma linea,
        // para que pegar un bloque de texto con varios links no obligue a acomodarlos a mano.
        function parsearFotos(texto) {
            return texto.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
        }

        function obtenerUrlsFotosDe(textareaId) {
            return parsearFotos(document.getElementById(textareaId).value);
        }

        function previsualizarFotos(textareaId, previewId) {
            const cont = document.getElementById(previewId);
            const urls = obtenerUrlsFotosDe(textareaId);
            const cabecera = `<div class="fotos-edit-count">${urls.length} foto${urls.length === 1 ? '' : 's'} cargada${urls.length === 1 ? '' : 's'}</div>`;
            const miniaturas = urls.map((u, i) => `
                <div class="fotos-edit-thumb">
                    <img src="${u}" onerror="this.style.display='none'">
                    <button type="button" onclick="quitarFoto('${textareaId}', '${previewId}', ${i})"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            cont.innerHTML = cabecera + '<div class="fotos-edit-preview">' + miniaturas + '</div>';
        }

        function quitarFoto(textareaId, previewId, indice) {
            const urls = obtenerUrlsFotosDe(textareaId);
            urls.splice(indice, 1);
            document.getElementById(textareaId).value = urls.join('\n');
            previsualizarFotos(textareaId, previewId);
        }

        // ---------- Edicion de franquicias ----------
        let edicionActualId = null;

        function abrirEdicionFr(id) {
            const f = franquicias.find(x => x.id === id);
            if (!f) return;
            edicionActualId = id;
            document.getElementById('ed-nombre').value = f.nombre || '';
            document.getElementById('ed-aliado').value = f.aliado || '';
            document.getElementById('ed-categoria').value = f.categoria || 'Alimentos y Bebidas';
            document.getElementById('ed-inversion').value = f.inversion_total || '';
            document.getElementById('ed-cuota').value = f.cuota_franquicia || '';
            document.getElementById('ed-regalias').value = f.regalias || '';
            document.getElementById('ed-retorno').value = f.retorno_estimado || '';
            document.getElementById('ed-espacio').value = f.espacio_requerido || '';
            document.getElementById('ed-empleados').value = f.empleados_requeridos || '';
            document.getElementById('ed-unidades').value = f.unidades_actuales || '';
            document.getElementById('ed-anos').value = f.anos_en_mercado || '';
            document.getElementById('ed-territorios').value = f.territorios_disponibles || '';
            document.getElementById('ed-link').value = f.link_referencia || '';
            document.getElementById('ed-beneficios').value = (f.beneficios || []).join('\n');
            document.getElementById('ed-desc').value = f.descripcion_original || '';
            document.getElementById('ed-fotos').value = (f.fotos || []).join('\n');
            previsualizarFotos('ed-fotos', 'ed-fotos-preview');
            document.getElementById('modal-editar-fr').classList.add('show');
        }

        function cerrarEdicionFr() {
            document.getElementById('modal-editar-fr').classList.remove('show');
            edicionActualId = null;
        }

        async function guardarEdicionFr() {
            if (!edicionActualId) return;
            const body = {
                nombre: document.getElementById('ed-nombre').value.trim(),
                aliado: document.getElementById('ed-aliado').value.trim() || 'Retail Solutions',
                categoria: document.getElementById('ed-categoria').value,
                inversion_total: document.getElementById('ed-inversion').value.trim() || null,
                cuota_franquicia: document.getElementById('ed-cuota').value.trim() || null,
                regalias: document.getElementById('ed-regalias').value.trim() || null,
                retorno_estimado: document.getElementById('ed-retorno').value.trim() || null,
                espacio_requerido: document.getElementById('ed-espacio').value.trim() || null,
                empleados_requeridos: document.getElementById('ed-empleados').value.trim() || null,
                unidades_actuales: document.getElementById('ed-unidades').value.trim() || null,
                anos_en_mercado: document.getElementById('ed-anos').value.trim() || null,
                territorios_disponibles: document.getElementById('ed-territorios').value.trim() || null,
                link_referencia: document.getElementById('ed-link').value.trim() || null,
                beneficios: document.getElementById('ed-beneficios').value.split('\n').map(s => s.trim()).filter(Boolean),
                descripcion_original: document.getElementById('ed-desc').value.trim() || null,
                fotos: obtenerUrlsFotosDe('ed-fotos'),
            };
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/franquicias?id=eq.${edicionActualId}`, {
                    method: 'PATCH', headers: { ...headers, Prefer: 'return=minimal' }, body: JSON.stringify(body),
                });
                if (!res.ok) throw new Error('No se pudo guardar (' + res.status + ')');
                Object.assign(franquicias.find(x => x.id === edicionActualId), body);
                renderFr();
                cerrarEdicionFr();
            } catch (ex) {
                alert(ex.message);
            }
        }

        // ---------- Edicion de propiedades ----------
        let edicionPropActualId = null;

        function abrirEdicionProp(id) {
            const p = propiedades.find(x => x.id === id);
            if (!p) return;
            edicionPropActualId = id;
            document.getElementById('edp-link').value = p.link_referencia || '';
            document.getElementById('edp-titulo').value = p.titulo || '';
            document.getElementById('edp-precio').value = p.precio || '';
            document.getElementById('edp-ubicacion').value = p.ubicacion || '';
            document.getElementById('edp-categoria').value = p.categoria || 'Vivienda Residencial';
            document.getElementById('edp-tipo-contrato').value = p.tipo_contrato || 'venta';
            document.getElementById('edp-tipo-propiedad').value = p.tipo_propiedad_detalle || '';
            document.getElementById('edp-id-externo').value = p.id_externo || '';
            document.getElementById('edp-hab').value = p.habitaciones || '';
            document.getElementById('edp-banos').value = p.banos || '';
            document.getElementById('edp-m2').value = p.m2 || '';
            document.getElementById('edp-tamano-lote').value = p.tamano_lote || '';
            document.getElementById('edp-tamano-construccion').value = p.tamano_construccion || '';
            document.getElementById('edp-latitud').value = p.latitud ?? '';
            document.getElementById('edp-longitud').value = p.longitud ?? '';
            document.getElementById('edp-tour').value = p.tour_virtual_url || '';
            document.getElementById('edp-video').value = p.video_url || '';
            document.getElementById('edp-garage').checked = !!p.garage;
            document.getElementById('edp-hoa').checked = !!p.hoa;
            document.getElementById('edp-comunidad-cerrada').checked = !!p.comunidad_cerrada;
            document.getElementById('edp-nueva').checked = !!p.propiedad_nueva;
            document.getElementById('edp-desc').value = p.descripcion_original || '';
            document.getElementById('edp-copy').value = p.copy_venta || '';
            document.getElementById('edp-fotos').value = (p.fotos || []).join('\n');
            previsualizarFotos('edp-fotos', 'edp-fotos-preview');
            document.getElementById('modal-editar-prop').classList.add('show');
        }

        function cerrarEdicionProp() {
            document.getElementById('modal-editar-prop').classList.remove('show');
            edicionPropActualId = null;
        }

        async function guardarEdicionProp() {
            if (!edicionPropActualId) return;
            const body = {
                link_referencia: document.getElementById('edp-link').value.trim() || null,
                titulo: document.getElementById('edp-titulo').value.trim() || 'Propiedad sin título',
                precio: document.getElementById('edp-precio').value.trim() || 'Precio a consultar',
                ubicacion: document.getElementById('edp-ubicacion').value.trim() || null,
                categoria: document.getElementById('edp-categoria').value,
                tipo_contrato: document.getElementById('edp-tipo-contrato').value,
                tipo_propiedad_detalle: document.getElementById('edp-tipo-propiedad').value.trim() || null,
                id_externo: document.getElementById('edp-id-externo').value.trim() || null,
                habitaciones: document.getElementById('edp-hab').value.trim() || null,
                banos: document.getElementById('edp-banos').value.trim() || null,
                m2: document.getElementById('edp-m2').value.trim() || null,
                tamano_lote: document.getElementById('edp-tamano-lote').value.trim() || null,
                tamano_construccion: document.getElementById('edp-tamano-construccion').value.trim() || null,
                latitud: parseFloat(document.getElementById('edp-latitud').value) || null,
                longitud: parseFloat(document.getElementById('edp-longitud').value) || null,
                tour_virtual_url: document.getElementById('edp-tour').value.trim() || null,
                video_url: document.getElementById('edp-video').value.trim() || null,
                garage: document.getElementById('edp-garage').checked,
                hoa: document.getElementById('edp-hoa').checked,
                comunidad_cerrada: document.getElementById('edp-comunidad-cerrada').checked,
                propiedad_nueva: document.getElementById('edp-nueva').checked,
                descripcion_original: document.getElementById('edp-desc').value.trim() || null,
                copy_venta: document.getElementById('edp-copy').value.trim() || null,
                fotos: obtenerUrlsFotosDe('edp-fotos'),
            };
            try {
                const headers = await CostoSVAuth.authHeaders();
                const res = await fetch(`${SUPA_URL}/rest/v1/propiedades?id=eq.${edicionPropActualId}`, {
                    method: 'PATCH', headers: { ...headers, Prefer: 'return=minimal' }, body: JSON.stringify(body),
                });
                if (!res.ok) throw new Error('No se pudo guardar (' + res.status + ')');
                Object.assign(propiedades.find(x => x.id === edicionPropActualId), body);
                render();
                cerrarEdicionProp();
            } catch (ex) {
                alert(ex.message);
            }
        }

        // Permite llegar directo al formulario de edición de una ficha puntual
        // desde el panel principal, con ?editar=<id> (y &tipo=fr para franquicias).
        function abrirEdicionDesdeQueryString() {
            const params = new URLSearchParams(window.location.search);
            const editarId = params.get('editar');
            if (!editarId) return;
            if (params.get('tipo') === 'fr') {
                cambiarTabGestion('fr');
                abrirEdicionFr(editarId);
            } else {
                cambiarTabGestion('prop');
                abrirEdicionProp(editarId);
            }
        }

        CostoSVAuth.requireLogin(async () => {
            await cargarTodas();
            await cargarTodasFr();
            abrirEdicionDesdeQueryString();
        });
    </script>

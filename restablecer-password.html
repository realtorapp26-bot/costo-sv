<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Restablecer contraseña | CostoSV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: rgba(10,15,28,0.92); min-height: 100vh; display: flex;
            align-items: center; justify-content: center; font-family: 'Outfit', sans-serif;
        }
        .reset-box {
            background: white; padding: 32px; border-radius: 12px; width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .reset-box h2 { margin: 0 0 4px; font-size: 1.2rem; color: var(--primary); font-family: 'Playfair Display', serif; }
        .reset-box p.sub { margin: 0 0 18px; font-size: 0.85rem; color: var(--text-light); }
        .reset-box input {
            width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.95rem; font-family: 'Outfit', sans-serif;
        }
        .reset-box button {
            width: 100%; padding: 11px; background: var(--gold); color: var(--primary); border: none;
            border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
        }
        .reset-box button:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-msg { font-size: 0.85rem; margin-bottom: 12px; padding: 10px 12px; border-radius: 6px; display: none; }
        .reset-msg.error { background: #fef2f2; color: #b91c1c; display: block; }
        .reset-msg.ok { background: #e7f7ec; color: #1b5e20; display: block; }
    </style>
</head>
<body>
    <div class="reset-box">
        <h2>Restablecer contraseña</h2>
        <p class="sub">Costo SV — uso interno</p>
        <div id="reset-msg" class="reset-msg"></div>
        <form id="reset-form">
            <input type="password" id="pass1" placeholder="Contraseña nueva" required minlength="6" autocomplete="new-password">
            <input type="password" id="pass2" placeholder="Repetir contraseña" required minlength="6" autocomplete="new-password">
            <button type="submit" id="reset-btn">Guardar contraseña</button>
        </form>
        <p class="sub" style="margin-top:14px;"><a href="panel.html">Volver al panel</a></p>
    </div>

    <script src="config.js?v=2"></script>
    <script>
        (function () {
            const CFG = window.SITE_CONFIG || {};
            const SUPA_URL = CFG.SUPABASE_URL;
            const SUPA_KEY = CFG.SUPABASE_ANON_KEY;
            const msg = document.getElementById('reset-msg');
            const form = document.getElementById('reset-form');
            const btn = document.getElementById('reset-btn');

            function mostrar(texto, ok) {
                msg.textContent = texto;
                msg.className = 'reset-msg ' + (ok ? 'ok' : 'error');
            }

            // Supabase manda el token de recuperacion en el fragmento de la URL:
            // #access_token=...&type=recovery&...
            const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const accessToken = params.get('access_token');
            const tipo = params.get('type');

            if (!accessToken || tipo !== 'recovery') {
                mostrar('Este link no es válido o ya expiró. Pedí uno nuevo desde el panel ("¿Olvidaste tu contraseña?").', false);
                form.style.display = 'none';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const p1 = document.getElementById('pass1').value;
                const p2 = document.getElementById('pass2').value;
                if (p1 !== p2) { mostrar('Las contraseñas no coinciden.', false); return; }
                if (p1.length < 6) { mostrar('La contraseña debe tener al menos 6 caracteres.', false); return; }

                btn.disabled = true;
                btn.textContent = 'Guardando...';
                try {
                    const res = await fetch(`${SUPA_URL}/auth/v1/user`, {
                        method: 'PUT',
                        headers: { apikey: SUPA_KEY, Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: p1 }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error_description || data.msg || 'No se pudo actualizar la contraseña.');
                    mostrar('¡Listo! Tu contraseña se actualizó. Ya podés entrar al panel con la nueva.', true);
                    form.style.display = 'none';
                } catch (ex) {
                    mostrar(ex.message, false);
                    btn.disabled = false;
                    btn.textContent = 'Guardar contraseña';
                }
            });
        })();
    </script>
</body>
</html>

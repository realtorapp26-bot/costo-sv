name: Mantener despierto Supabase

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta minima a Supabase
        id: ping
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://iseoyfiteeobzvtfjhoe.supabase.co/rest/v1/uso_ia?select=id&limit=1" \
            -H "apikey: sb_publishable_EWNNEWfk4DjuIGwkrbtx4g_PFMtzhSv" \
            -H "Authorization: Bearer sb_publishable_EWNNEWfk4DjuIGwkrbtx4g_PFMtzhSv")
          echo "Supabase respondio: $codigo"
          if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reactivar proyecto si esta pausado
        if: steps.ping.outputs.ok != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::La consulta fallo y no hay SUPABASE_ACCESS_TOKEN configurado para reactivar el proyecto automaticamente."
            exit 1
          fi
          echo "La consulta fallo, probablemente el proyecto esta pausado. Pidiendo reactivacion..."
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/iseoyfiteeobzvtfjhoe/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Respuesta de restore: $codigo"
          if [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]; then
            echo "Reactivacion solicitada con exito. Supabase tarda 1-2 minutos en terminar de levantar."
          else
            echo "::error::No se pudo reactivar el proyecto (HTTP $codigo)."
            exit 1
          fi
